name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "src/mdl/web/**"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成静态站点
        env:
          # 在仓库 Settings → Variables 里配 MDL_API_BASE，构建时注入后端地址。
          # 留空则站点启动后由用户点「⚙ 设置」自行填写。
          MDL_API_BASE: ${{ vars.MDL_API_BASE }}
        run: python scripts/build_pages.py --api "$MDL_API_BASE"

      - name: 校验产物
        run: |
          test -f docs/index.html
          test -f docs/app.js
          test -f docs/app.css
          grep -q 'src="./app.js"' docs/index.html
          node --check docs/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
